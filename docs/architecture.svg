<rect x="1000" y="437" width="520" height="120" rx="8" fill="#e8f5e9" stroke="#5aa76a"/>
<text x="1010" y="458" font-weight="600">5 ParallelAgent · preflight fan-out / gather (error index as code)</text>
<g fill="#fff" stroke="#5aa76a"><rect x="1012" y="468" width="118" height="26" rx="5"/><rect x="1138" y="468" width="118" height="26" rx="5"/><rect x="1264" y="468" width="118" height="26" rx="5"/><rect x="1390" y="468" width="118" height="26" rx="5"/>
<rect x="1012" y="500" width="118" height="26" rx="5"/><rect x="1138" y="500" width="118" height="26" rx="5"/><rect x="1264" y="500" width="118" height="26" rx="5"/><rect x="1390" y="500" width="118" height="26" rx="5"/></g>
<g font-size="11" text-anchor="middle" fill="#222"><text x="1071" y="486">content rights</text><text x="1197" y="486">age rating 2026</text><text x="1323" y="486">price · availability</text><text x="1449" y="486">IAP territories</text>
<text x="1071" y="518">IAP readiness</text><text x="1197" y="518">screenshots + vision</text><text x="1323" y="518">review details</text><text x="1449" y="518">build · web gates</text></g>
<text x="1010" y="548" fill="#444">→ auto-fix (14 fixers) → read back → re-check → deterministic BLOCK/PASS · operator items for web-only gates</text>

<rect x="1000" y="567" width="520" height="40" rx="8" fill="#eef2ff" stroke="#8da2d6"/>
<text x="1010" y="592" font-weight="600">6 Submission</text><text x="1110" y="592" fill="#444" font-size="11">reviewSubmissions → items → submitted:true · gates: DRY_RUN · ALLOW_SUBMIT · allowlist</text>

<rect x="1000" y="617" width="520" height="96" rx="8" fill="#fde8e8" stroke="#d07070"/>
<text x="1010" y="640" font-weight="600">7 Watcher</text><text x="1090" y="640" fill="#444">webhook state transitions · days-long · no polling</text>
<text x="1010" y="662" fill="#444">rejection text → <tspan font-weight="600">Gemma 4</tspan> first-pass label → Gemini router → re-opens the right stage → re-queue</text>
<text x="1010" y="684" fill="#444">approved → job closed · operator items → status page</text>
<text x="1010" y="704" fill="#888">(Resolution Center text has no public API: POST /jobs/{id}/rejection)</text>
</g>

