</defs>
<rect width="1800" height="1000" fill="#ffffff"/>
<text x="40" y="48" font-size="30" font-weight="700" fill="#111">Shipwright — build lands in App Store Connect → agent drives it to Waiting for Review</text>
<text x="40" y="76" font-size="16" fill="#555">Trigger: Apple webhook (nothing typed). Stack: Google ADK · Gemini 3.5 Flash on Vertex AI · Gemma 4 · Cloud Run · Pub/Sub · Firestore · Cloud Storage · Secret Manager · Cloud Scheduler</text>

<!-- Apple column -->
<rect x="40" y="110" width="300" height="840" rx="16" fill="#f5f5f7" stroke="#c9c9cf"/>
<text x="60" y="140" font-size="18" font-weight="700" fill="#333"> Apple · App Store Connect</text>
<rect x="60" y="165" width="260" height="70" rx="10" fill="#fff" stroke="#999"/>
<text x="190" y="195" font-size="15" text-anchor="middle" font-weight="600">xcodebuild -exportArchive</text>
<text x="190" y="217" font-size="13" text-anchor="middle" fill="#666">build 2 uploaded → processed</text>
<rect x="60" y="280" width="260" height="110" rx="10" fill="#fff" stroke="#999"/>
